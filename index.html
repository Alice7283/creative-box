<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>創意盒子系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#3a2e2a;--muted:#8a7d72;--cream:#fbf6ee;--line:#eadfce;--berry:#e85d75;--blue:#243a5e}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);font-family:'Noto Sans TC',sans-serif;background:radial-gradient(circle at 8% 5%,rgba(242,167,59,.14),transparent 28%),radial-gradient(circle at 91% 8%,rgba(123,108,196,.13),transparent 26%),var(--cream);min-height:100vh}
    main{width:min(1180px,calc(100% - 36px));margin:auto;padding:66px 0 80px} header{text-align:center;margin-bottom:42px}.eyebrow{font:700 13px 'Baloo 2';letter-spacing:.22em;color:var(--berry)}h1{font:800 clamp(38px,7vw,68px)/1 'Baloo 2';margin:8px 0 14px}.lead{color:var(--muted);margin:auto;max-width:600px;line-height:1.8}
    .section{margin-top:38px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:0 0 18px}.section h2{font:800 28px 'Baloo 2','Noto Sans TC';margin:0}.section p{color:var(--muted);margin:5px 0 0;line-height:1.7}.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:22px}.box{grid-column:span 2;position:relative;display:block;color:inherit;text-decoration:none;background:#fff;border:2.5px solid var(--accent);border-radius:30px;padding:18px 18px 24px;box-shadow:0 12px 35px rgba(58,46,42,.07);transition:.2s;overflow:hidden}.box:hover{transform:translateY(-7px) rotate(-.5deg);box-shadow:0 20px 45px rgba(58,46,42,.13)}.box img{display:block;width:100%;aspect-ratio:1.35;object-fit:cover;border-radius:20px;background:#f5eee5;transition:.25s}.box:hover img{transform:scale(1.025)}.box h3{font:800 25px 'Baloo 2','Noto Sans TC';margin:19px 4px 3px}.box p{color:var(--muted);font-size:13px;margin:0 4px}.arrow{position:absolute;right:22px;bottom:23px;color:var(--accent);font-weight:900}.creative{--accent:#e85d75}.party{--accent:#304a71}.kids{--accent:#f2a73b}.alpha{--accent:#7b6cc4}.flower{--accent:#3aa98c}.quote{--accent:var(--blue)}.shared .box{grid-column:span 3}.shared .box img{aspect-ratio:1.9;object-fit:cover;object-position:center}
    footer{text-align:center;color:#a39283;font-size:12px;margin-top:48px}@media(max-width:850px){.boxes{grid-template-columns:1fr 1fr}.box,.shared .box{grid-column:auto}}@media(max-width:560px){main{padding-top:42px}.section-head{display:block}.boxes{grid-template-columns:1fr}.box{display:grid;grid-template-columns:110px 1fr;gap:15px;align-items:center;padding:14px}.box img{aspect-ratio:1}.box h3{font-size:21px;margin:0}.arrow{right:18px;bottom:18px}.shared .box img{aspect-ratio:1}}
  </style>
</head>
<body><main>
  <header><div class="eyebrow">CREATIVE BOX SYSTEM</div><h1>今天要打開哪個盒子？</h1><p class="lead">把不同品牌、工作場域與共用營運工具，集中收進同一個入口。</p></header>
  <section class="section" aria-label="我的盒子">
    <div class="section-head"><div><h2>我的盒子</h2><p>各品牌與場域底下的專用工具。</p></div></div>
    <div class="boxes">
      <a class="box creative" href="creative/"><img src="assets/creative.jpg" alt="創意盒子錄影機插畫"><div><h3>創意盒子</h3><p>影像、內容與內部營運工具</p></div><span class="arrow">→</span></a>
      <a class="box party" href="party/"><img src="assets/party.jpg" alt="派對盒子禮物盒插畫"><div><h3>派對盒子</h3><p>活動體驗與派對服務工具</p></div><span class="arrow">→</span></a>
      <a class="box kids" href="kidsbox/"><img src="assets/kids.jpg" alt="小宇宙盒子星球插畫"><div><h3>小宇宙盒子</h3><p>Kid's Box 親子與兒童派對</p></div><span class="arrow">→</span></a>
      <a class="box alpha" href="alphabeta/"><img src="assets/alphabeta.jpg" alt="呼嚕島貓咪插畫"><div><h3>呼嚕島</h3><p>Alpha &amp; Beta 寵物品牌</p></div><span class="arrow">→</span></a>
      <a class="box flower" href="flowerbox/"><img src="assets/flower.jpg" alt="花盒空間插畫"><div><h3>花盒空間</h3><p>場地營運與空間管理工具</p></div><span class="arrow">→</span></a>
    </div>
  </section>
  <section class="section shared" aria-label="共用工具">
    <div class="section-head"><div><h2>共用工具</h2><p>所有盒子共用的基礎營運系統。</p></div></div>
    <div class="boxes">
      <a class="box quote" href="quote-system/"><img src="assets/quote-system.jpg" alt="統一報價系統報價板與計算機插畫"><div><h3>統一報價系統</h3><p>跨盒子建立報價、查詢歷史報價、管理客戶與服務方案。</p></div><span class="arrow">→</span></a>
    </div>
  </section>
  <footer>創意盒子系統 · Alice 的工具集合</footer>
</main></body></html>
