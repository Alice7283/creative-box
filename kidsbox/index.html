<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小宇宙盒子｜創意盒子系統</title><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--accent:#f2a73b;--ink:#3a2e2a;--muted:#8a7d72;--cream:#fbf6ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 8%,rgba(242,167,59,.16),transparent 28%),var(--cream);color:var(--ink);font-family:'Noto Sans TC',sans-serif}.wrap{width:min(960px,calc(100% - 34px));margin:auto;padding:36px 0 80px}.back{color:var(--ink);text-decoration:none;font-weight:700}.hero{margin:50px 0 30px}.tag{font:700 12px 'Baloo 2';letter-spacing:.18em;color:var(--accent)}h1{font:800 clamp(38px,7vw,62px) 'Baloo 2';margin:6px 0}.hero p{color:var(--muted)}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.tool{color:inherit;text-decoration:none;background:#fff;border:2.5px solid var(--accent);border-radius:24px;padding:27px;box-shadow:0 10px 28px rgba(58,46,42,.07);transition:.2s}.tool:hover{transform:translateY(-5px) rotate(-.4deg)}.icon{font-size:42px}.tool h2{font:800 25px 'Baloo 2';margin:13px 0 5px}.tool p{color:var(--muted);margin:0;line-height:1.7}@media(max-width:650px){.tools{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="back" href="../">← 返回所有盒子</a><section class="hero"><div class="tag">KID'S BOX</div><h1>小宇宙盒子</h1><p>親子服務、兒童派對與新體驗的工具。</p></section><section class="tools"><a class="tool" href="calculator/"><div class="icon">🎂</div><h2>兒童慶生派對計算機</h2><p>輸入場次、人數與成本，快速試算一天總成本、每組成本與目標利潤。</p></a></section></main></body></html>
