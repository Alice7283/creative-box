<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17443b">
  <title>花盒二館｜客服訊息工具</title>
  <style>
    :root {
      --green-950: #12362f;
      --green-800: #17443b;
      --green-600: #2d6a59;
      --green-100: #e8f1ed;
      --cream: #f7f3ea;
      --paper: #fffdf8;
      --orange: #d4773a;
      --ink: #25312d;
      --muted: #68746f;
      --line: #d9dfdb;
      --danger: #a54838;
      --shadow: 0 14px 40px rgba(20, 54, 47, .10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 0 0, rgba(212,119,58,.12), transparent 30rem),
        var(--cream);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1440px; margin: 0 auto; padding: 24px; }
    header {
      display: flex; align-items: end; justify-content: space-between; gap: 20px;
      margin-bottom: 22px;
    }
    .eyebrow { color: var(--orange); font-weight: 800; letter-spacing: .12em; font-size: 13px; }
    h1 { margin: 4px 0 5px; color: var(--green-950); font-size: clamp(28px, 4vw, 44px); line-height: 1.08; }
    .subtitle { margin: 0; color: var(--muted); }
    .status { min-height: 24px; color: var(--green-600); font-weight: 700; text-align: right; }

    .category-section {
      margin: 0 0 24px; padding: 18px; border: 1px solid #d5e1dc; border-radius: 20px;
      background: rgba(255,253,248,.88); box-shadow: 0 8px 24px rgba(20,54,47,.06);
    }
    .category-heading { margin: 0 0 4px; color: var(--green-950); font-size: 20px; }
    .category-help { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
    .category-bar {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
    }
    .category-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border: 1px solid var(--line); border-radius: 14px;
      background: rgba(255,255,255,.72); color: var(--green-800);
      padding: 15px 16px; font-weight: 900; text-align: left;
    }
    .category-btn:hover { border-color: var(--green-600); }
    .category-btn.active { background: var(--green-800); border-color: var(--green-800); color: white; }
    .category-count {
      min-width: 28px; height: 28px; display: grid; place-items: center; padding: 0 8px;
      border-radius: 999px; color: var(--green-800); background: var(--green-100); font-size: 13px;
    }
    .category-btn.active .category-count { color: var(--green-950); background: white; }

    .workspace { min-height: 640px; }
    .toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      margin: 4px 0 16px;
    }
    .category-title { margin: 0; color: var(--green-950); font-size: 24px; }
    .search {
      width: min(340px, 100%); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px;
      background: white; outline: none;
    }
    .search:focus, .field input:focus, .field textarea:focus {
      border-color: var(--green-600); box-shadow: 0 0 0 3px rgba(45,106,89,.12);
    }
    .message-list { display: grid; gap: 16px; }
    .message-card {
      background: var(--paper); border: 1px solid rgba(23,68,59,.14); border-radius: var(--radius);
      box-shadow: 0 8px 26px rgba(20,54,47,.07); overflow: hidden;
    }
    .message-card.open { border-color: #a9c7ba; box-shadow: var(--shadow); }
    .message-summary {
      width: 100%; display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 14px;
      padding: 18px 20px; border: 0; background: transparent; color: var(--ink); text-align: left;
    }
    .message-summary:hover { background: rgba(232,241,237,.65); }
    .number {
      width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px;
      background: var(--green-100); color: var(--green-800); font-weight: 900;
    }
    .message-title { margin: 0 0 4px; color: var(--green-950); font-size: 19px; }
    .message-description { margin: 0; color: var(--muted); font-size: 14px; }
    .open-label { color: var(--green-600); font-weight: 800; white-space: nowrap; }
    .message-card.open .open-label { color: var(--orange); }
    .message-body { display: none; padding: 0 20px 22px 80px; }
    .message-card.open .message-body { display: block; }
    .hint { margin: 0 0 16px; padding: 10px 12px; border-radius: 10px; color: var(--muted); background: var(--cream); }
    .editor-grid { display: grid; grid-template-columns: minmax(260px, .72fr) minmax(360px, 1.28fr); gap: 18px; }
    .input-area, .output-area { min-width: 0; }
    .section-label { margin: 0 0 10px; color: var(--green-950); font-size: 15px; font-weight: 900; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .empty { color: var(--muted); padding: 24px 6px; text-align: center; }

    .field.full { grid-column: 1 / -1; }
    .field label { display: block; margin: 0 0 6px; font-size: 14px; font-weight: 800; }
    .field input, .field textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px;
      background: white; color: var(--ink); outline: none;
    }
    .field textarea { min-height: 86px; resize: vertical; }
    .helper { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .reset-btn {
      margin-top: 12px; border: 0; background: transparent; color: var(--muted); padding: 7px 0;
      text-decoration: underline;
    }
    .preview-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
    .copy-btn {
      border: 0; border-radius: 12px; padding: 11px 18px; background: var(--orange); color: white; font-weight: 900;
      box-shadow: 0 7px 18px rgba(212,119,58,.22);
    }
    .copy-btn:hover { filter: brightness(.96); }
    .copy-btn:active { transform: translateY(1px); }
    .preview {
      width: 100%; min-height: 320px; border: 1px solid var(--line); border-radius: 14px;
      padding: 16px; resize: vertical; color: var(--ink); background: white; line-height: 1.7; outline: none;
      white-space: pre-wrap;
    }
    .preview-note { margin: 10px 2px 0; color: var(--muted); font-size: 12px; }

    @media (max-width: 960px) {
      .editor-grid { grid-template-columns: 1fr; }
      .preview { min-height: 300px; }
    }
    @media (max-width: 720px) {
      .shell { padding: 16px; }
      header { align-items: start; flex-direction: column; }
      .status { text-align: left; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .category-bar { grid-template-columns: 1fr 1fr; }
      .category-btn { padding: 13px; }
      .search { width: 100%; }
      .message-summary { grid-template-columns: 40px 1fr; padding: 15px; }
      .open-label { grid-column: 2; }
      .message-body { padding: 0 15px 18px; }
      .fields { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .preview { min-height: 360px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">FLOWER BOX 2</div>
        <h1>客服訊息工具</h1>
        <p class="subtitle">選分類、填資料、複製訊息，三步完成。</p>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
    </header>

    <section class="category-section" aria-labelledby="categoryHeading">
      <h2 id="categoryHeading" class="category-heading">請先選擇大分類</h2>
      <p class="category-help">按下分類後，下方會列出這一類的全部訊息。</p>
      <nav id="categoryBar" class="category-bar" aria-label="訊息分類">
        <button class="category-btn active" data-category="welcome" type="button"><span>接待與詢價</span><span class="category-count">2則</span></button>
        <button class="category-btn" data-category="booking" type="button"><span>預約與付款</span><span class="category-count">5則</span></button>
        <button class="category-btn" data-category="visit" type="button"><span>場勘與設備</span><span class="category-count">6則</span></button>
        <button class="category-btn" data-category="event" type="button"><span>飲食與活動</span><span class="category-count">6則</span></button>
        <button class="category-btn" data-category="day" type="button"><span>活動當日與離場</span><span class="category-count">8則</span></button>
        <button class="category-btn" data-category="after" type="button"><span>售後與其他</span><span class="category-count">2則</span></button>
      </nav>
    </section>

    <section class="workspace">
      <div class="toolbar">
        <h2 id="categoryTitle" class="category-title"></h2>
        <input id="search" class="search" type="search" placeholder="搜尋這個分類的訊息…" aria-label="搜尋訊息">
      </div>
      <div id="messageList" class="message-list"></div>
    </section>
  </main>

  <script src="app.js?v=20260710-1200"></script>
</body>
</html>
